#@TYPE: Machine
#@NAME: Grinn Astra 2619 sbc
#@DESCRIPTION: Machine configuration for the Grinn Astra 2619 sbc

require conf/machine/include/soms/grinn-astra-2619-som.inc
require conf/machine/include/platforms/grinn-astra-2619-platform.inc

MACHINEOVERRIDES =. "grinn-astra-261x-sbc:"

SYNA_KERNEL_DTBO_FILE = "synaptics/ov5647-camera-overlay.dtbo \
            synaptics/waveshare-7inch-panel-overlay.dtbo \
"

# The ram-2gb machine feature selects the 2 GB RAM variant of the board.
GRINN_SYNASDK_CONFIG_NATIVE_DEFCONFIG = "${@bb.utils.contains( \
    'MACHINE_FEATURES', \
    'ram-2gb', \
    'astra_2619_sbc_poky_aarch64_2gb_defconfig', \
    'astra_2619_sbc_poky_aarch64_1gb_defconfig', \
    d \
)}"
